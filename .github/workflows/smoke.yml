name: smoke

# Zero-spend smoke suite for skill-orchestration-os (27 tests: registry,
# planner incl. route-aware prompt + wrapped-steps normalization + replan,
# executor incl. the route DAG skill + unknown-domain rejection + per-step
# verification, meta-learner, audit, the skill-os route --dry-run CLI +
# stubbed-dispatch, the reality feedback loop (09 -> 02 -> 04) with its
# TASK_FAILED event contract, the dispatch-failure feedback link, the wired
# replay-consumer gate leg (malformed stream -> non-zero exit, absent stream
# -> exit 0, REGRESSED flip through the real consumer), the replay-events CLI
# subcommand (same contract via `skill-os replay-events` + auto-bound git
# head), vendored-consumer parity (scripts/vendored/ stays byte-identical to
# the canonical sibling — the CI fallback), vault-check-first routability,
# canonical-vs-shim registry sync guard, and sovereign-verification
# routability). Two tests skip visibly in CI when their sibling trees aren't
# checked out (~/.hermes skill tree, domain-router shim) — they run at full
# strength locally. The replay legs run EVERYWHERE: cli.CONSUMER_PATH
# resolves the canonical sibling locally and the vendored copy in CI, so the
# mutation surface is identical on both and cmd_replay_events is
# mutation-covered in CI like local.
#
# Zero-spend by design: the suite uses --domain (no DeepSeek classification)
# and dry-run (no subagent dispatch). It is stdlib-only — no dependencies to
# install. IMPORTANT: do NOT add API-key secrets to this repo. The suite is
# only guaranteed zero-spend because the runner environment carries no paid
# credentials (test_deepseek_plan would make a real call if DEEPSEEK_API_KEY
# were present).
#
# The mutation floor leg mirrors the coverage floor in the other repos: a
# FRESH mutmut run on the pushed code must score >= 50% (standing artifacts
# are never trusted in CI — they'd be stale against a new HEAD). mutmut is
# pinned to 3.7.0 so CI scores match the local runs. It is zero-spend: mutmut
# only runs the in-repo smoke suite; no network, no keys.

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 6 * * *"   # daily 06:30 UTC
  workflow_dispatch:

jobs:
  smoke:
    name: zero-spend smoke suite (27 tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Smoke suite (run once, assert 28/28)
        run: |
          python scripts/smoke_test.py 2>&1 | tee /tmp/smoke.log
          grep -q '28/28 passed' /tmp/smoke.log

      - name: Mutation floor (T5 gate — fresh mutmut run >= 50%)
        run: |
          set -euo pipefail
          # Fresh measurement on the pushed code; the setup.cfg pins
          # source_paths=runtime+cli.py, test selection=scripts/smoke_test.py,
          # also_copy=domains.json+scripts (the dry-run test shells to cli.py
          # from inside the mutant tree). Fail-closed: exit 1 below 50%, exit 2
          # if mutmut never produced verdicts.
          pip install -q 'mutmut==3.7.0' pytest pytest-cov
          mutmut run 2>&1 | tee /tmp/mutmut.log | tail -3
          python scripts/hygiene/mutation_score_snapshot.py --min 50
